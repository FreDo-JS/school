<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saving Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Saving Tracker</h1>
        <button>+ New Goal</button>
    </header>
    
    <main>

        <section class="first-section">
            <div class="total">
                <p>Total savings</p>
                <p><strong>$11,249.00</strong></p>
            </div>
            <div class="active">
                <p>Active goals</p>
                <p><strong>7</strong></p>
            </div>
            <div class="completed">
                <p>Goals completed</p>
                <p><strong>2</strong></p>
            </div>
            <div class="monthly">
                <p>monthly deposit</p>
            </div>
        </section>

    </main>
</body>
</html>
